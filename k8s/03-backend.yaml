apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tars-storage-pvc
  namespace: tars
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tars-data-pvc
  namespace: tars
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tars-backend
  namespace: tars
  labels:
    app: tars-backend
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: tars-backend
  template:
    metadata:
      labels:
        app: tars-backend
    spec:
      containers:
        - name: backend
          image: tars-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: tars-config
                  key: POSTGRES_USER
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: tars-config
                  key: POSTGRES_DB
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tars-secret
                  key: POSTGRES_PASSWORD
            - name: TARS_DATABASE_URL
              value: "postgresql+asyncpg://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@tars-db:5432/$(POSTGRES_DB)"
            - name: TARS_ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: tars-config
                  key: TARS_ENVIRONMENT
            - name: TARS_STORAGE_DIR
              valueFrom:
                configMapKeyRef:
                  name: tars-config
                  key: TARS_STORAGE_DIR
            - name: TARS_DOMAIN
              valueFrom:
                configMapKeyRef:
                  name: tars-config
                  key: TARS_DOMAIN
            - name: TARS_JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: tars-secret
                  key: TARS_JWT_SECRET_KEY
            - name: TARS_GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: tars-secret
                  key: TARS_GEMINI_API_KEY
          volumeMounts:
            - name: storage-data
              mountPath: /app/storage
            - name: app-data
              mountPath: /app/data
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
      volumes:
        - name: storage-data
          persistentVolumeClaim:
            claimName: tars-storage-pvc
        - name: app-data
          persistentVolumeClaim:
            claimName: tars-data-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: tars-backend
  namespace: tars
  labels:
    app: tars-backend
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
      name: http
  selector:
    app: tars-backend
