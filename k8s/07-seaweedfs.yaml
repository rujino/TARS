# ==============================================================================
# SeaweedFS for TARS OKF Storage (k3s Production Manifest)
# Components: Master + Volume Server + Filer (Embedded LevelDB) + S3 Gateway
# ==============================================================================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: seaweedfs-data-pvc
  namespace: tars
  labels:
    app: seaweedfs
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: seaweedfs-config
  namespace: tars
  labels:
    app: seaweedfs
data:
  # Filer 디렉토리 메타데이터 및 S3 인증 설정
  seaweed_s3_config.json: |
    {
      "identities": [
        {
          "name": "tars-admin",
          "credentials": [
            {
              "accessKey": "tars-admin-access-key",
              "secretKey": "tars-admin-secret-key-at-least-16-chars"
            }
          ],
          "actions": [
            "Admin",
            "Read",
            "Write",
            "List",
            "Tagging"
          ]
        }
      ]
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seaweedfs
  namespace: tars
  labels:
    app: seaweedfs
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: seaweedfs
  template:
    metadata:
      labels:
        app: seaweedfs
    spec:
      containers:
        - name: seaweedfs
          image: chrislusf/seaweedfs:latest
          imagePullPolicy: IfNotPresent
          args:
            - "server"
            - "-dir=/data"
            - "-s3"
            - "-s3.port=8333"
            - "-s3.config=/etc/seaweedfs/seaweed_s3_config.json"
            - "-volume.max=50"
          ports:
            - containerPort: 8333
              name: s3-api
              protocol: TCP
            - containerPort: 9333
              name: master
              protocol: TCP
            - containerPort: 8888
              name: filer
              protocol: TCP
            - containerPort: 8080
              name: volume
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /status
              port: 9333
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /status
              port: 9333
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
          volumeMounts:
            - name: seaweedfs-data
              mountPath: /data
            - name: seaweedfs-config-volume
              mountPath: /etc/seaweedfs
      volumes:
        - name: seaweedfs-data
          persistentVolumeClaim:
            claimName: seaweedfs-data-pvc
        - name: seaweedfs-config-volume
          configMap:
            name: seaweedfs-config
---
apiVersion: v1
kind: Service
metadata:
  name: seaweedfs-s3
  namespace: tars
  labels:
    app: seaweedfs
spec:
  type: ClusterIP
  ports:
    - port: 8333
      targetPort: 8333
      name: s3-api
    - port: 8888
      targetPort: 8888
      name: filer
    - port: 9333
      targetPort: 9333
      name: master
  selector:
    app: seaweedfs
