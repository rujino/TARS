services:
  postgres:
    image: postgres:16-alpine
    container_name: tars-dev-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: tars
      POSTGRES_USER: tarsuser
      POSTGRES_PASSWORD: tarspassword
    ports:
      - "5432:5432"
    volumes:
      - dev_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: tars-dev-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  langfuse-db:
    image: postgres:16-alpine
    container_name: tars-dev-langfuse-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: langfuse
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: langfusepassword
    volumes:
      - dev_langfuse_db_data:/var/lib/postgresql/data

  langfuse-web:
    image: ghcr.io/langfuse/langfuse:2
    container_name: tars-dev-langfuse-web
    restart: unless-stopped
    depends_on:
      - langfuse-db
    environment:
      DATABASE_URL: "postgresql://langfuse:langfusepassword@langfuse-db:5432/langfuse"
      NEXTAUTH_URL: "http://localhost:3000"
      NEXTAUTH_SECRET: "119d717cf2fc0781cc448a77b24204bf00cbc832ae8100c5c7b68c51f9f4e1a3"
      SALT: "10420300dac61ba235cd7fd2524c10e35f914af73d1856bdcd47511a82617807"
      ENCRYPTION_KEY: "cb4abe3e6f4e0cb210ddd506f4273b303c4b8728f44e831235445d8ba8219431"
      TELEMETRY_ENABLED: "false"
    ports:
      - "3000:3000"

  seaweedfs:
    image: chrislusf/seaweedfs:latest
    container_name: tars-dev-seaweedfs
    restart: unless-stopped
    command:
      - "server"
      - "-dir=/data"
      - "-s3"
      - "-s3.port=8333"
      - "-s3.config=/etc/seaweedfs/seaweed_s3_config.json"
      - "-volume.max=50"
    ports:
      - "8333:8333"  # S3 API Endpoint (FastAPI aioboto3 connection)
      - "9333:9333"  # Master Web UI / API
      - "8888:8888"  # Filer Web UI / Knowledge File Browser
    volumes:
      - dev_seaweedfs_data:/data
      - ./configs/seaweedfs/seaweed_s3_config.json:/etc/seaweedfs/seaweed_s3_config.json:ro

volumes:
  dev_postgres_data:
  dev_langfuse_db_data:
  dev_seaweedfs_data:
