services:
  postgres:
    image: postgres:16-alpine
    container_name: tars-dev-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: tars
      POSTGRES_USER: tarsuser
      POSTGRES_PASSWORD: tarspassword
    ports:
      - "5432:5432"
    volumes:
      - dev_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: tars-dev-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  dev_postgres_data:
